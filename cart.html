<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart — Code with Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/partials.js"></script>

  <header class="page-header">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> / Cart</div>
      <h1>Your Cart</h1>
      <p id="tableNotice" style="margin-top:.5rem;color:var(--text-muted)"></p>
    </div>
  </header>

  <section class="section" style="padding-top: 1rem">
    <div class="container">
      <div class="layout-2" id="cartLayout">
        <div class="panel" id="itemsPanel">
          <h3>Items</h3>
          <div id="cartItems"></div>
        </div>
        <div>
          <div class="panel">
            <h3>Order Summary</h3>
            <div id="summary"></div>
            <a href="checkout.html" id="checkoutBtn" class="btn btn-primary btn-block" style="margin-top: 1rem">Proceed to Checkout</a>
            <a href="menu.html" class="btn btn-ghost btn-block" style="margin-top:.5rem">Continue shopping</a>
          </div>
        </div>
      </div>
      <div id="emptyCart" style="display:none; text-align:center; padding: 3rem 1rem;">
        <div style="font-size:5rem">🛒</div>
        <h2 style="margin-top:1rem">Your cart is empty</h2>
        <p style="margin: .5rem 0 1.5rem">Looks like you haven't added anything yet.</p>
        <a class="btn btn-primary" href="menu.html">Browse the Menu</a>
      </div>
    </div>
  </section>

  <script src="assets/js/main.js"></script>
  <script>
    function renderCart() {
      const items = API.cartItems();
      const host = document.getElementById('cartItems');
      const sum = document.getElementById('summary');
      const layout = document.getElementById('cartLayout');
      const empty = document.getElementById('emptyCart');

      if (!items.length) { layout.style.display = 'none'; empty.style.display = 'block'; return; }
      layout.style.display = ''; empty.style.display = 'none';

      host.innerHTML = items.map(it => `
        <div class="cart-item" data-id="${it.cartItemId}">
          <div class="cart-thumb">${it.img ? `<img src="${it.img}" alt="${it.name}" />` : it.icon}</div>
          <div class="cart-info">
            <b>${it.name}</b>
            <small>${it.cat} · ${priceTag(it.customization?.customPrice ?? it.price)} each</small>
            <div style="margin-top:.5rem" class="qty">
              <button data-act="dec">−</button>
              <span>${it.qty}</span>
              <button data-act="inc">+</button>
            </div>
          </div>
          <div style="text-align:right">
            <b>${priceTag((it.customization?.customPrice ?? it.price) * it.qty)}</b><br/>
            <button class="remove" data-act="rm">Remove</button>
          </div>
        </div>`).join('');

      const sub = API.cartSubtotal();
      const tax = Math.round(sub * 0.05);
      const total = sub + tax;
      sum.innerHTML = `
        <div class="summary-row"><span>Subtotal</span><span>${priceTag(sub)}</span></div>
        <div class="summary-row"><span>Tax (5% GST)</span><span>${priceTag(tax)}</span></div>
        <div class="summary-row"><span>Service</span><span>Dine in</span></div>
        <div class="summary-row total"><span>Total</span><span>${priceTag(total)}</span></div>`;
      localStorage.setItem('cwc-order-total', total);

      host.querySelectorAll('.cart-item').forEach(row => {
        const id = row.dataset.id;
        const cur = API.getCart().find(c => c.cartItemId === id).qty;
        row.querySelector('[data-act=inc]').onclick = () => { API.updateQty(id, cur + 1); renderCart(); };
        row.querySelector('[data-act=dec]').onclick = () => { API.updateQty(id, Math.max(1, cur - 1)); renderCart(); };
        row.querySelector('[data-act=rm]').onclick = () => { API.removeFromCart(id); toast('Removed'); renderCart(); };
      });
    }
    renderCart();
    const table = API.getTable();
    document.getElementById('tableNotice').textContent = table ? `Your order will be served at Table ${table}.` : 'Scan your table QR code to attach your table number.';
  </script>
</body>
</html>
