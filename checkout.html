<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm Order — Code with Coffee</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css"></head><body><script src="assets/js/partials.js"></script>
<header class="page-header"><div class="container"><div class="crumbs"><a href="cart.html">Cart</a> / Confirm</div><span class="eyebrow">Dine-in order</span><h1>Confirm your table order</h1><p style="margin-top:.5rem">We’ll bring everything directly to your table.</p></div></header>
<section class="section" style="padding-top:1rem"><div class="container"><form id="checkoutForm" class="layout-2"><div><div class="panel"><h3>Table details</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem"><div class="form-row"><label>Table number</label><input name="table" id="tableNumber" required readonly></div><div class="form-row"><label>Your name (optional)</label><input name="name" placeholder="So we can call you"></div></div><div class="form-row"><label>Order note (optional)</label><textarea name="notes" rows="2" placeholder="Less sugar, no onions, etc."></textarea></div></div><div class="panel"><h3>Have a coupon?</h3><div style="display:flex;gap:.5rem"><input class="input" placeholder="Enter coupon code (try BREW10)" id="coupon" style="flex:1"><button type="button" class="btn btn-outline" id="applyCoupon">Apply</button></div><small id="couponMsg" style="display:block;margin-top:.5rem;color:var(--text-muted)"></small></div></div><aside><div class="panel"><h3>Order Summary</h3><div id="checkoutSummary"></div><button type="submit" class="btn btn-primary btn-block" style="margin-top:1rem">Choose payment</button><small style="display:block;text-align:center;margin-top:.75rem;color:var(--text-muted)">Your table number is sent to the kitchen</small></div></aside></form></div></section>
<script src="assets/js/main.js"></script><script>let discount=0;function renderSummary(){const items=API.cartItems(),sub=API.cartSubtotal(),tax=Math.round((sub-discount)*.05),total=sub-discount+tax;document.getElementById('checkoutSummary').innerHTML=`${items.map(i=>`<div class="summary-row"><span>${i.name} × ${i.qty}</span><span>${priceTag(i.price*i.qty)}</span></div>`).join('')}<div class="summary-row" style="border-top:1px solid var(--border);padding-top:.75rem;margin-top:.5rem"><span>Subtotal</span><span>${priceTag(sub)}</span></div>${discount?`<div class="summary-row" style="color:var(--success)"><span>Coupon</span><span>−${priceTag(discount)}</span></div>`:''}<div class="summary-row"><span>Tax (5%)</span><span>${priceTag(tax)}</span></div><div class="summary-row"><span>Service</span><span>Dine in</span></div><div class="summary-row total"><span>Total</span><span>${priceTag(total)}</span></div>`;localStorage.setItem('cwc-order-total',total)}renderSummary();const field=document.getElementById('tableNumber'),table=API.getTable();field.value=table||'';if(!table){field.removeAttribute('readonly');field.placeholder='Enter table number'}document.getElementById('applyCoupon').onclick=()=>{const code=document.getElementById('coupon').value.trim().toUpperCase(),msg=document.getElementById('couponMsg');if(code==='BREW10'){discount=Math.round(API.cartSubtotal()*.1);msg.textContent='10% off applied';msg.style.color='var(--success)'}else{discount=0;msg.textContent='Invalid code';msg.style.color='var(--danger)'}renderSummary()};document.getElementById('checkoutForm').addEventListener('submit',e=>{e.preventDefault();if(!API.cartItems().length)return toast('Your cart is empty','error');const customer=Object.fromEntries(new FormData(e.target));localStorage.setItem('cwc-checkout',JSON.stringify(customer));localStorage.setItem('cwc-table',customer.table);location.href='payment.html'});</script></body></html>
