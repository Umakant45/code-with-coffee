<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu — Code with Coffee</title>
  <meta name="description" content="Explore our full menu of coffee, tea, snacks, desserts, and breakfast." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <script src="assets/js/partials.js"></script>

  <header class="page-header">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> / Menu</div>
      <span class="eyebrow">Eat · Drink · Enjoy</span>
      <h1>The Menu</h1>
      <p style="max-width:560px; margin: 1rem auto 0">From a perfect espresso to a slice of tiramisu — handpicked classics and seasonal specials.</p>
    </div>
  </header>

  <section class="section" style="padding-top: 1rem">
    <div class="container">
      <div class="toolbar">
        <div class="search-wrap">
          <span class="ico">🔍</span>
          <input id="menuSearch" type="search" placeholder="Search the menu…" aria-label="Search menu" />
        </div>
        <div class="chips" id="catChips"></div>
      </div>
      <div class="grid-cards" id="menuGrid"></div>
      <p id="emptyState" style="text-align:center; color:var(--text-muted); padding: 3rem 0; display:none">No items match your search.</p>
    </div>
  </section>

  <script src="assets/js/main.js"></script>
  <script>
    const cats = ['All', 'Coffee', 'Tea', 'Snacks', 'Desserts', 'Breakfast'];
    let active = 'All', query = '';

    const chipsHost = document.getElementById('catChips');
    chipsHost.innerHTML = cats.map(c => `<button class="chip ${c==='All'?'active':''}" data-cat="${c}">${c}</button>`).join('');
    chipsHost.addEventListener('click', e => {
      const b = e.target.closest('[data-cat]'); if (!b) return;
      active = b.dataset.cat;
      chipsHost.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.cat === active));
      render();
    });
    document.getElementById('menuSearch').addEventListener('input', e => { query = e.target.value.toLowerCase().trim(); render(); });

    function render() {
      const items = API.getMenu().filter(i =>
        (active === 'All' || i.cat === active) &&
        (!query || i.name.toLowerCase().includes(query) || i.cat.toLowerCase().includes(query))
      );
      const host = document.getElementById('menuGrid');
      host.innerHTML = items.map(productCard).join('');
      document.getElementById('emptyState').style.display = items.length ? 'none' : 'block';
      bindCardActions(host);
      // re-trigger reveal
      host.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
    }
    render();
  </script>
</body>
</html>
