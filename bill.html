<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bill — Code with Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    @media print {
      .nav, .footer, .to-top, .page-loader, .no-print { display: none !important; }
      body { background: #fff !important; }
      .invoice { box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body>
  <script src="assets/js/partials.js"></script>

  <main class="section" style="padding-top: calc(var(--nav-h) + 2rem)">
    <div class="container" style="max-width: 880px">
      <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom: 1.5rem">
        <div>
          <span class="eyebrow">Order Receipt</span>
          <h1 style="font-size:2rem">Invoice / Bill</h1>
        </div>
        <div style="display:flex; gap:.5rem">
          <button class="btn btn-outline" onclick="window.print()">🖨 Print Bill</button>
          <button class="btn btn-primary" onclick="downloadBill()">⬇ Download Bill</button>
        </div>
      </div>

      <div class="invoice" id="invoice">
        <div class="invoice-head">
          <div>
            <div class="brand" style="margin-bottom:.5rem"><span class="brand-mark">☕</span><span>Code with Coffee</span></div>
            <small style="color:var(--text-muted)">42 Bean Street, Brewtown<br/>hello@codewithcoffee.cafe · +91 98765 43210</small>
          </div>
          <div style="text-align:right">
            <b style="font-family:var(--font-display); font-size:1.25rem" id="invId">CWC-00000000</b><br/>
            <small style="color:var(--text-muted)" id="invDate">—</small><br/>
            <span style="display:inline-block; margin-top:.5rem; padding:.3rem .7rem; background:rgba(76,175,125,.1); color:var(--success); border-radius:999px; font-size:.78rem; font-weight:700">PAID</span>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 1.5rem">
          <div>
            <small style="color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600">Billed to</small>
            <div id="billTo" style="margin-top:.4rem"></div>
          </div>
          <div>
            <small style="color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600">Payment method</small>
            <div id="billMethod" style="margin-top:.4rem">—</div>
          </div>
        </div>

        <table>
          <thead><tr><th>Item</th><th>Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Subtotal</th></tr></thead>
          <tbody id="billItems"></tbody>
        </table>

        <div style="margin-top: 1.5rem; margin-left: auto; max-width: 320px">
          <div id="billTotals"></div>
        </div>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px dashed var(--border); text-align:center; color:var(--text-muted); font-size:.85rem">
          Thank you for choosing Code with Coffee ☕ See you soon!
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    const order = API.getLastOrder();
    if (!order) { document.getElementById('invoice').innerHTML = '<p style="text-align:center; padding:2rem">No recent order found. <a href="menu.html" style="color:var(--gold-dark)">Place an order →</a></p>'; }
    else {
      document.getElementById('invId').textContent = order.id;
      document.getElementById('invDate').textContent = new Date(order.date).toLocaleString();
      const c = order.customer || {};
      document.getElementById('billTo').innerHTML = `<b>${c.name||'—'}</b><br/><small>${c.email||''}</small><br/><small>${c.mobile||''}</small><br/><small>${[c.addr,c.city,c.state,c.pin].filter(Boolean).join(', ')}</small>`;
      document.getElementById('billMethod').innerHTML = `<b style="text-transform:uppercase">${order.method||'—'}</b>`;
      document.getElementById('billItems').innerHTML = (order.items||[]).map(i => `<tr><td>${i.icon||''} ${i.name}</td><td>${i.qty}</td><td style="text-align:right">${priceTag(i.price)}</td><td style="text-align:right">${priceTag(i.price*i.qty)}</td></tr>`).join('');
      document.getElementById('billTotals').innerHTML = `
        <div class="summary-row"><span>Subtotal</span><span>${priceTag(order.subtotal||0)}</span></div>
        <div class="summary-row"><span>Tax (5%)</span><span>${priceTag(order.tax||0)}</span></div>
        <div class="summary-row"><span>Delivery</span><span>${order.shipping?priceTag(order.shipping):'FREE'}</span></div>
        <div class="summary-row total"><span>Grand Total</span><span>${priceTag(order.total||0)}</span></div>`;
    }
    function downloadBill() {
      const html = '<!doctype html><meta charset="utf-8"><title>Bill</title>' + document.getElementById('invoice').outerHTML +
        '<style>body{font-family:sans-serif;padding:2rem;color:#222} table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}</style>';
      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (order?.id || 'bill') + '.html';
      a.click();
    }
  </script>
</body>
</html>
