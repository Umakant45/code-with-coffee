<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — Code with Coffee</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css"></head><body><script src="assets/js/partials.js"></script><header class="page-header"><div class="container"><div class="crumbs"><a href="checkout.html">Confirm</a> / Payment</div><h1>Choose how you’d like to pay</h1><p style="margin-top:.5rem;color:var(--text-muted)">Demo only — no real charge will be made.</p></div></header><section class="section" style="padding-top:1rem"><div class="container"><div class="layout-2"><div class="panel"><h3>Payment options</h3><div class="pay-options" id="payOptions"><label class="pay-option active"><input type="radio" name="pay" value="upi" checked><div style="font-size:1.5rem">📱</div><div><b>UPI</b><br><small style="color:var(--text-muted)">Google Pay, PhonePe, Paytm</small></div></label><label class="pay-option"><input type="radio" name="pay" value="card"><div style="font-size:1.5rem">💳</div><div><b>Credit / Debit Card</b><br><small style="color:var(--text-muted)">Visa, Mastercard, Rupay</small></div></label><label class="pay-option"><input type="radio" name="pay" value="counter"><div style="font-size:1.5rem">💵</div><div><b>Pay at Counter</b><br><small style="color:var(--text-muted)">Pay when served or when you collect</small></div></label></div><div id="upiForm" style="margin-top:1.5rem"><div class="form-row"><label>UPI ID</label><input placeholder="yourname@bank"></div></div><button class="btn btn-primary btn-block" id="payBtn" style="margin-top:1.5rem">Place order <span id="payAmount">₹0</span></button></div><div class="panel"><h3>Table order</h3><p id="tableText" style="margin-bottom:1rem"></p><div id="paySummary"></div></div></div></div></section><div id="okOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;place-items:center"><div class="panel" style="text-align:center;max-width:420px;padding:2.5rem"><div style="font-size:4rem">✅</div><h2 style="margin:1rem 0 .5rem">Order confirmed</h2><p>Your order is with the kitchen. We’ll serve it at your table.</p><a href="bill.html" class="btn btn-primary" style="margin-top:1.25rem">View order</a></div></div><script src="assets/js/main.js"></script><script>const items=API.cartItems(),sub=API.cartSubtotal(),tax=Math.round(sub*.05),total=sub+tax;document.getElementById('payAmount').textContent=priceTag(total);const customer=JSON.parse(localStorage.getItem('cwc-checkout')||'{}'),table=customer.table||API.getTable()||'—';document.getElementById('tableText').textContent=`Serving at Table ${table}`;document.getElementById('paySummary').innerHTML=items.map(i=>`<div class="summary-row"><span>${i.name} × ${i.qty}</span><span>${priceTag(i.price*i.qty)}</span></div>`).join('')+`<div class="summary-row" style="border-top:1px solid var(--border);padding-top:.75rem;margin-top:.5rem"><span>Subtotal</span><span>${priceTag(sub)}</span></div><div class="summary-row"><span>Tax</span><span>${priceTag(tax)}</span></div><div class="summary-row total"><span>Total</span><span>${priceTag(total)}</span></div>`;document.querySelectorAll('.pay-option').forEach(o=>o.addEventListener('click',()=>{document.querySelectorAll('.pay-option').forEach(x=>x.classList.remove('active'));o.classList.add('active');document.getElementById('upiForm').style.display=o.querySelector('input').value==='upi'?'block':'none'}));document.getElementById('payBtn').onclick=()=>{if(!items.length)return toast('Your cart is empty','error');const method=document.querySelector('input[name=pay]:checked').value;API.placeOrder({items,customer,table,method,total,subtotal:sub,tax,status:'New'});API.clearCart();document.getElementById('okOverlay').style.display='grid'};</script></body></html>
